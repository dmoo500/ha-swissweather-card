name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Enable Corepack
      run: corepack enable
      
    - name: Install dependencies
      run: yarn install --immutable
      
    - name: Build
      run: yarn build
      
    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
    - name: Update version in package.json
      run: |
        node -e "const fs=require('fs');const p=require('./package.json');p.version='${{ steps.version.outputs.VERSION }}';fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\\n');"
        
    - name: Create release archive
      id: create_release 
      run: |
        mkdir -p release
        cp swissweather-card.js release/
        cp README.md release/
        cp LICENSE release/
        cp hacs.json release/
        cd release
        zip -r ../swissweather-card-${{ steps.version.outputs.VERSION }}.zip .
      
    - name: Generate changelog
      id: changelog
      run: |
        if [ -f CHANGELOG.md ]; then
          # Extract current version changes
          sed -n '/^## \[/,/^## \[/p' CHANGELOG.md | head -n -1 > current_changes.md
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          cat current_changes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "CHANGELOG=Release ${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
        fi
        
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        release_name: SwissWeather Card ${{ steps.version.outputs.VERSION }}
        body: |
          ## 🎉 SwissWeather Card ${{ steps.version.outputs.VERSION }}
          
          ### 📦 Installation
          
          #### HACS (Recommended)
          1. Add this repository to HACS
          2. Search for "SwissWeather Card"
          3. Install the latest version

          #### Manual
          1. Download `swissweather-card.js`
          2. Copy it to `config/www/`
          3. Add the resource to Lovelace

          ### 📋 Changelog
          ${{ steps.changelog.outputs.CHANGELOG }}

          ### 🔧 Compatibility
          - Home Assistant 2025.8+
          - Modern browsers (Chrome 90+, Firefox 88+, Safari 14+)
          
        draft: false
        prerelease: false        
        
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./swissweather-card-${{ steps.version.outputs.VERSION }}.zip
        asset_name: swissweather-card-${{ steps.version.outputs.VERSION }}.zip
        asset_content_type: application/zip
      continue-on-error: true
        
    - name: Upload individual file
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release/swissweather-card.js
        asset_name: swissweather-card.js
        asset_content_type: application/javascript
      continue-on-error: true
