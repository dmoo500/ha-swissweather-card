name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        
    - name: Enable Corepack
      run: corepack enable
      
    - name: Install dependencies
      run: yarn install --immutable
      
    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
    - name: Update version in package.json
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.RELEASE_VERSION;fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"

    - name: Build
      run: yarn build
        
    - name: Create release archive
      id: create_release 
      run: |
        mkdir -p release
        cp swissweather-card.js release/
        cp README.md release/
        cp LICENSE release/
        cp hacs.json release/
        cd release
        zip -r ../swissweather-card-${{ steps.version.outputs.VERSION }}.zip .
      
    - name: Generate changelog
      id: changelog
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        GH_TOKEN: ${{ github.token }}
      run: |
        : > current_changes.md
        if [ -f CHANGELOG.md ]; then
          awk -v heading="## [$RELEASE_VERSION]" '
            /^## \[/ {
              if (found) exit
              found = ($0 == heading || index($0, heading " ") == 1)
            }
            found { print }
          ' CHANGELOG.md > current_changes.md
        fi
        if [ ! -s current_changes.md ]; then
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_VERSION" --jq '.body' > current_changes.md
        fi
        delimiter="CHANGELOG_$(node -p 'crypto.randomUUID()')"
        echo "CHANGELOG<<$delimiter" >> "$GITHUB_OUTPUT"
        cat current_changes.md >> "$GITHUB_OUTPUT"
        echo "$delimiter" >> "$GITHUB_OUTPUT"
        
    - name: Delete existing release if present
      run: gh release delete ${{ steps.version.outputs.VERSION }} -y || true
      env:
        GH_TOKEN: ${{ github.token }}
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: SwissWeather Card ${{ steps.version.outputs.VERSION }}
        prerelease: ${{ contains(steps.version.outputs.VERSION, 'b') }}
        body: |
          ## 🎉 SwissWeather Card ${{ steps.version.outputs.VERSION }}
          
          ### 📦 Installation
          
          #### HACS (Recommended)
          1. Add this repository to HACS
          2. Search for "SwissWeather Card"
          3. Install the latest version

          #### Manual
          1. Download `swissweather-card.js`
          2. Copy it to `config/www/`
          3. Add the resource to Lovelace

          ### 📋 Changelog
          ${{ steps.changelog.outputs.CHANGELOG }}

          ### 🔧 Compatibility
          - Home Assistant 2025.8+
          - Modern browsers (Chrome 90+, Firefox 88+, Safari 14+)
        files: |
          swissweather-card-${{ steps.version.outputs.VERSION }}.zip
          release/swissweather-card.js
        fail_on_unmatched_files: false
